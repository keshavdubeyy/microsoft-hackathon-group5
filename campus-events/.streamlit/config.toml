[theme]
base = "light"
primaryColor = "#000000"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f1f1"
textColor = "#000000"
font = "sans serif"
# Design system: hairline borders, 6px cards, pill buttons
borderColor = "#0000001f"
baseRadius = "6px"
buttonRadius = "full"

[browser]
gatherUsageStats = false

[server]
# Local only. The demo logins are public in the README, so the app must not be
# reachable from other machines on the network.
address = "localhost"
